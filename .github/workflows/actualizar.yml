name: Actualizar y publicar

on:
  # Dos veces al día (hora UTC: 05:17 y 13:17 → 07:17 y 15:17 en Madrid en verano)
  schedule:
    - cron: '17 5,13 * * *'
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
    inputs:
      meses_iniciales:
        description: 'Solo para la primera carga: cuántos meses hacia atrás leer'
        default: '6'
      reiniciar:
        description: 'Borrar los datos y cargarlo todo de nuevo (tarda 1-2 horas)'
        type: boolean
        default: false
  # Al subir cambios de la web (sin descargar datos)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Reiniciar datos
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.reiniciar == 'true'
        run: rm -f public/data/*.json

      - name: Descargar licitaciones
        if: github.event_name != 'push'
        env:
          MESES_INICIALES: ${{ github.event.inputs.meses_iniciales || '6' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/actualizar.mjs

      - name: Guardar datos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar web
        id: publicar
        uses: actions/deploy-pages@v4
