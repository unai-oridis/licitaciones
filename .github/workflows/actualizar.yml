name: Actualizar y publicar
# Descarga las licitaciones y las guarda en el repositorio. Cloudflare Pages publica la web
# automáticamente con cada cambio (y genera las páginas por provincia y sector).

on:
  # Cada 3 horas (GitHub a veces se salta alguna ejecución programada; así no importa).
  # Las alertas se envían una vez al día, en la primera ejecución a partir de las 6:00 (hora de Madrid).
  schedule:
    - cron: '17 */3 * * *'
  # Botón "Run workflow" en la pestaña Actions. También lo pulsa cada 3 horas el
  # "despertador" de Cloudflare (despertador/worker.js), por si GitHub se salta el horario.
  workflow_dispatch:
    inputs:
      meses_iniciales:
        description: 'Solo para la primera carga: cuántos meses hacia atrás leer'
        default: '6'
      reiniciar:
        description: 'Borrar los datos y cargarlo todo de nuevo (tarda 1-2 horas)'
        type: boolean
        default: false
      enviar_alertas:
        description: 'Enviar también las alertas por email al terminar'
        type: boolean
        default: false
      completar_municipios:
        description: 'Una sola vez: añadir el municipio a las licitaciones antiguas (tarda 1-2 horas)'
        type: boolean
        default: false
      automatico:
        description: 'Uso interno: lo marca el despertador de Cloudflare (no tocar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Reiniciar datos
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.reiniciar == 'true'
        run: rm -f public/data/*.json

      - name: Descargar licitaciones
        env:
          MESES_INICIALES: ${{ github.event.inputs.meses_iniciales || '6' }}
          COMPLETAR_MUNICIPIOS: ${{ github.event.inputs.completar_municipios == 'true' && '1' || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/actualizar.mjs

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Si mientras tanto otra ejecución guardó datos, se quedan los de esta (son los más recientes:
          # cada ejecución lee las novedades desde la última lectura guardada, así que no se pierde nada).
          # GitHub a veces falla al recibir muchos datos: se reintenta hasta 5 veces.
          for intento in 1 2 3 4 5; do
            if git pull --rebase -X theirs -q && git push; then
              echo "Datos guardados"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Fallo al guardar (intento $intento/5), reintentando en $((intento * 30)) s"
            sleep $((intento * 30))
          done
          echo "No se pudieron guardar los datos en el repositorio"
          exit 1

      - name: Subir datos de empresas (páginas /empresa/)
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/subir-empresas.mjs

      - name: Enviar alertas por email
        if: github.event_name == 'schedule' || github.event.inputs.automatico == 'true' || github.event.inputs.enviar_alertas == 'true'
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SITIO: https://licitaempresa.es
          FORZAR: ${{ github.event.inputs.enviar_alertas == 'true' && '1' || '' }}
        run: node scripts/enviar-alertas.mjs
