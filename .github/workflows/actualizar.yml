name: Actualizar y publicar

on:
  # Cada 3 horas (GitHub a veces se salta alguna ejecución programada; así no importa).
  # Las alertas se envían una vez al día, en la primera ejecución a partir de las 6:00 (hora de Madrid).
  schedule:
    - cron: '17 */3 * * *'
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
    inputs:
      meses_iniciales:
        description: 'Solo para la primera carga: cuántos meses hacia atrás leer'
        default: '6'
      reiniciar:
        description: 'Borrar los datos y cargarlo todo de nuevo (tarda 1-2 horas)'
        type: boolean
        default: false
      enviar_alertas:
        description: 'Enviar también las alertas por email al terminar'
        type: boolean
        default: false
  # Al subir cambios de la web (sin descargar datos)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Reiniciar datos
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.reiniciar == 'true'
        run: rm -f public/data/*.json

      - name: Descargar licitaciones
        if: github.event_name != 'push'
        env:
          MESES_INICIALES: ${{ github.event.inputs.meses_iniciales || '6' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/actualizar.mjs

      - name: Guardar datos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          # GitHub a veces falla al recibir muchos datos: se reintenta hasta 5 veces.
          for intento in 1 2 3 4 5; do
            if git pull --rebase -q && git push; then
              echo "Datos guardados"
              exit 0
            fi
            echo "Fallo al guardar (intento $intento/5), reintentando en $((intento * 30)) s"
            sleep $((intento * 30))
          done
          echo "No se pudieron guardar los datos en el repositorio"
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar web
        id: publicar
        uses: actions/deploy-pages@v4

      - name: Enviar alertas por email
        if: github.event_name == 'schedule' || github.event.inputs.enviar_alertas == 'true'
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SITIO: https://licitaempresa.es
          FORZAR: ${{ github.event.inputs.enviar_alertas == 'true' && '1' || '' }}
        run: node scripts/enviar-alertas.mjs
