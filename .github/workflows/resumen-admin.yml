name: Resumen diario para el administrador
# Lo lanza cada día a las 7:00 (hora de Madrid) el despertador de Cloudflare (despertador/worker.js).
# También se puede lanzar a mano desde la pestaña Actions con «Run workflow».

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enviar resumen
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          SITIO: https://licitaempresa.es
        run: node scripts/resumen-admin.mjs
